<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111116;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { color: #00f2ff; margin-bottom: 5px; font-size: 28px; }
        p { color: #888899; margin-bottom: 30px; font-size: 14px; }
        
        .studio-box {
            background-color: #1a1a24;
            border: 2px solid #2d2d3f;
            border-radius: 12px;
            padding: 25px;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .title-bar {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0b0;
            text-align: left;
            margin-bottom: 12px;
            border-left: 3px solid #00f2ff;
            padding-left: 8px;
        }

        /* Drum Pads Styling */
        .drum-row {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
        }
        .drum-pad {
            flex: 1;
            height: 85px;
            background-color: #252535;
            border: 2px solid #3d3d56;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .drum-pad span {
            font-size: 11px;
            color: #00f2ff;
            margin-top: 5px;
            font-family: monospace;
        }
        .drum-pad:active, .drum-pad.active {
            background-color: #7b2cbf;
            border-color: #b5179e;
        }

        /* Keyboard Setup */
        .piano-container {
            position: relative;
            background-color: #000;
            padding: 3px;
            border-radius: 8px;
            height: 170px;
            display: flex;
        }
        .p-key {
            position: relative;
            cursor: pointer;
            box-sizing: border-box;
        }
        .p-key.white {
            height: 100%;
            flex: 1;
            background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
            border: 1px solid #111;
            border-radius: 0 0 4px 4px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10px;
            color: #222;
            font-weight: bold;
        }
        .p-key.white:active, .p-key.white.active {
            background: linear-gradient(to bottom, #ffffff 0%, #00f2ff 100%);
        }
        .p-key.black {
            height: 60%;
            width: 7%;
            background: linear-gradient(to bottom, #333 0%, #111 100%);
            border-radius: 0 0 3px 3px;
            z-index: 2;
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8px;
            color: #aaa;
            font-size: 11px;
        }
        .p-key.black:active, .p-key.black.active {
            background: #00f2ff;
            color: #000;
        }

        /* Black Keys Offsets positioning */
        #w-key { left: 7.5%; }
        #e-key { left: 18.5%; }
        #t-key { left: 41%; }
        #y-key { left: 52%; }
        #u-key { left: 63%; }

        .hint-text {
            font-size: 11px;
            font-family: monospace;
            opacity: 0.7;
            margin-top: 3px;
        }
    </style>
</head>
<body>

    <h1>Keys & Drums Studio</h1>
    <p>Click anywhere inside the box, then jam with your physical keys!</p>

    <div class="studio-box">
        <!-- DRUMS -->
        <div class="title-bar">Drum Section</div>
        <div class="drum-row">
            <div class="drum-pad" id="p-kick">KICK<span>[Space]</span></div>
            <div class="drum-pad" id="p-snare">SNARE<span>[B]</span></div>
            <div class="drum-pad" id="p-hihat">HI-HAT<span>[N]</span></div>
        </div>

        <!-- CHROMATIC SYNTH KEYBOARD -->
        <div class="title-bar">Synthesizer Piano Array</div>
        <div class="piano-container">
            <!-- White Keys -->
            <div class="p-key white" id="a-key">C4<span class="hint-text">A</span></div>
            <div class="p-key white" id="s-key">D4<span class="hint-text">S</span></div>
            <div class="p-key white" id="d-key">E4<span class="hint-text">D</span></div>
            <div class="p-key white" id="f-key">F4<span class="hint-text">F</span></div>
            <div class="p-key white" id="g-key">G4<span class="hint-text">G</span></div>
            <div class="p-key white" id="h-key">A4<span class="hint-text">H</span></div>
            <div class="p-key white" id="j-key">B4<span class="hint-text">J</span></div>
            <div class="p-key white" id="k-key">C5<span class="hint-text">K</span></div>
            <div class="p-key white" id="l-key">D5<span class="hint-text">L</span></div>

            <!-- Black Keys -->
            <div class="p-key black" id="w-key">C#<span class="hint-text">W</span></div>
            <div class="p-key black" id="e-key">D#<span class="hint-text">E</span></div>
            <div class="p-key black" id="t-key">F#<span class="hint-text">T</span></div>
            <div class="p-key black" id="y-key">G#<span class="hint-text">Y</span></div>
            <div class="p-key black" id="u-key">A#<span class="hint-text">U</span></div>
        </div>
    </div>

    <script>
        let ctx = null;

        function checkAudio() {
            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (ctx && ctx.state === 'suspended') {
                ctx.resume();
            }
        }

        // --- SYNTH TONE ---
        function playNote(freq) {
            checkAudio();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
        }

        // --- DRUM SOUND GENERATORS ---
        function drumKick() {
            checkAudio();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(130, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.8, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
        }

        function drumSnare() {
            checkAudio();
            const len = ctx.sampleRate * 0.12;
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const filt = ctx.createBiquadFilter();
            filt.type = 'highpass';
            filt.frequency.value = 1600;
            const gain = ctx.createGain();
            
            src.connect(filt);
            filt.connect(gain);
            gain.connect(ctx.destination);
            
            gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
            src.start();
            src.stop(ctx.currentTime + 0.12);
        }

        function drumHat() {
            checkAudio();
            const len = ctx.sampleRate * 0.04;
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const filt = ctx.createBiquadFilter();
            filt.type = 'bandpass';
            filt.frequency.value = 8500;
            const gain = ctx.createGain();
            
            src.connect(filt);
            filt.connect(gain);
            gain.connect(ctx.destination);
            
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
            src.start();
            src.stop(ctx.currentTime + 0.04);
        }

        // --- MAPS ---
        const keyMap = {
            'a': { id: 'a-key', fn: () => playNote(261.63) },
            's': { id: 's-key', fn: () => playNote(293.66) },
            'd': { id: 'd-key', fn: () => playNote(329.63) },
            'f': { id: 'f-key', fn: () => playNote(349.23) },
            'g': { id: 'g-key', fn: () => playNote(392.00) },
            'h': { id: 'h-key', fn: () => playNote(440.00) },
            'j': { id: 'j-key', fn: () => playNote(493.88) },
            'k': { id: 'k-key', fn: () => playNote(523.25) },
            'l': { id: 'l-key', fn: () => playNote(587.33) },
