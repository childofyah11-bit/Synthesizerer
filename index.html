<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keys & Drums Illusion Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111116;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { color: #00f2ff; margin-bottom: 5px; font-size: 28px; text-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }
        p { color: #888899; margin-bottom: 30px; font-size: 14px; }
        
        .studio-box {
            background-color: #1a1a24;
            border: 2px solid #2d2d3f;
            border-radius: 12px;
            padding: 25px;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .title-bar {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0b0;
            text-align: left;
            margin-bottom: 12px;
            border-left: 3px solid #00f2ff;
            padding-left: 8px;
        }

        /* Drum Pads Setup */
        .drum-row {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
        }
        .drum-pad {
            flex: 1;
            height: 85px;
            background-color: #252535;
            border: 2px solid #3d3d56;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            transition: background-color 0.1s, border-color 0.1s;
        }
        .drum-pad span {
            font-size: 11px;
            color: #00f2ff;
            margin-top: 5px;
            font-family: monospace;
        }
        
        /* Drum Trigger Illusion Styles */
        .drum-pad:active, .drum-pad.active {
            background-color: #7b2cbf;
            border-color: #b5179e;
            box-shadow: 0 0 15px rgba(181, 23, 158, 0.6);
            transform: scale(0.97);
        }

        /* Keyboard Setup */
        .piano-container {
            position: relative;
            background-color: #000;
            padding: 3px;
            border-radius: 8px;
            height: 170px;
            display: flex;
        }
        .p-key {
            position: relative;
            cursor: pointer;
            box-sizing: border-box;
            overflow: hidden;
            transition: background 0.05s, transform 0.05s;
        }
        
        /* White Keys */
        .p-key.white {
            height: 100%;
            flex: 1;
            background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
            border: 1px solid #111;
            border-radius: 0 0 4px 4px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10px;
            color: #222;
            font-weight: bold;
        }
        .p-key.white:active, .p-key.white.active {
            background: linear-gradient(to bottom, #ffffff 0%, #00f2ff 100%);
            box-shadow: inset 0 -15px 20px rgba(0, 242, 255, 0.4), 0 0 10px rgba(0, 242, 255, 0.5);
            color: #000;
        }
        
        /* Black Keys */
        .p-key.black {
            height: 60%;
            width: 7%;
            background: linear-gradient(to bottom, #333 0%, #111 100%);
            border-radius: 0 0 3px 3px;
            z-index: 2;
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8px;
            color: #aaa;
            font-size: 11px;
            border: 1px solid #000;
        }
        .p-key.black:active, .p-key.black.active {
            background: linear-gradient(to bottom, #333 0%, #ff007f 100%);
            border-color: #ff007f;
            box-shadow: inset 0 -10px 15px rgba(255, 0, 127, 0.6), 0 0 10px rgba(255, 0, 127, 0.5);
            color: #fff;
        }

        /* Black Keys Offsets Layout */
        #w-key { left: 7.5%; }
        #e-key { left: 18.5%; }
        #t-key { left: 41%; }
        #y-key { left: 52%; }
        #u-key { left: 63%; }

        .hint-text {
            font-size: 11px;
            font-family: monospace;
            opacity: 0.7;
            margin-top: 3px;
        }

        /* Shockwave Ripple Effect Illusion */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.4s linear;
            pointer-events: none;
        }
        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <h1>Keys & Drums Studio</h1>
    <p>Visual Engine Active: Press physical keys to trigger neon light wave illusions!</p>

    <div class="studio-box">
        <!-- DRUMS SECTION -->
        <div class="title-bar">Drum Section</div>
        <div class="drum-row">
            <div class="drum-pad" id="p-kick">KICK<span>[Space]</span></div>
            <div class="drum-pad" id="p-snare">SNARE<span>[B]</span></div>
            <div class="drum-pad" id="p-hihat">HI-HAT<span>[N]</span></div>
        </div>

        <!-- CHROMATIC SYNTH KEYBOARD -->
        <div class="title-bar">Synthesizer Piano Array</div>
        <div class="piano-container">
            <!-- White Keys -->
            <div class="p-key white" id="a-key">C4<span class="hint-text">A</span></div>
            <div class="p-key white" id="s-key">D4<span class="hint-text">S</span></div>
            <div class="p-key white" id="d-key">E4<span class="hint-text">D</span></div>
            <div class="p-key white" id="f-key">F4<span class="hint-text">F</span></div>
            <div class="p-key white" id="g-key">G4<span class="hint-text">G</span></div>
            <div class="p-key white" id="h-key">A4<span class="hint-text">H</span></div>
            <div class="p-key white" id="j-key">B4<span class="hint-text">J</span></div>
            <div class="p-key white" id="k-key">C5<span class="hint-text">K</span></div>
            <div class="p-key white" id="l-key">D5<span class="hint-text">L</span></div>

            <!-- Black Keys -->
            <div class="p-key black" id="w-key">C#<span class="hint-text">W</span></div>
            <div class="p-key black" id="e-key">D#<span class="hint-text">E</span></div>
            <div class="p-key black" id="t-key">F#<span class="hint-text">T</span></div>
            <div class="p-key black" id="y-key">G#<span class="hint-text">Y</span></div>
            <div class="p-key black" id="u-key">A#<span class="hint-text">U</span></div>
        </div>
    </div>

    <script>
        // --- VISUAL RIPPLE GENERATOR ENGINE ---
        function createVisualRipple(element) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            
            // Center the ripple inside the key/pad bounds
            const size = Math.max(element.clientWidth, element.clientHeight);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${element.clientWidth / 2 - size / 2}px`;
            ripple.style.top = `${element.clientHeight / 2 - size / 2}px`;
            
            // Clean up old ripple nodes to maintain page performance
            element.appendChild(ripple);
            setTimeout(() => ripple.remove(), 400);
        }

        // --- MAPPED INPUT DICTIONARY ---
        const keyMap = {
            'a': { id: 'a-key' },
            's': { id: 's-key' },
            'd': { id: 'd-key' },
            'f': { id: 'f-key' },
            'g': { id: 'g-key' },
            'h': { id: 'h-key' },
            'j': { id: 'j-key' },
            'k': { id: 'k-key' },
            'l': { id: 'l-key' },
            'w': { id: 'w-key' },
            'e': { id: 'e-key' },
            't': { id: 't-key' },
            'y': { id: 'y-key' },
            'u': { id: 'u-key' },
            ' ': { id: 'p-kick', scroll: true },
            'b': { id: 'p-snare' },
            'n': { id: 'p-hihat' }
        };

        // --- BIND INTERACTION TRIGGERS ---
        // Mouse click click visual tracking setup
        document.querySelectorAll('.p-key, .drum-pad').forEach(element => {
            element.addEventListener('mousedown', () => {
                createVisualRipple(element);
            });
        });

        // Physical Keyboard Down Press routing
        window.addEventListener('keydown', (e) => {
            const map = keyMap[e.key.toLowerCase()];
            if (map) {
                if (map.scroll) e.preventDefault(); // Prevents spacebar down-scroll
                
                const el = document.getElementById(map.id);
                if (el && !el.classList.contains('active')) {
                    el.classList.add('active');
                    createVisualRipple(el);
                }
            }
        });

        // Physical Keyboard Release Tracking
        window.addEventListener('keyup', (e) => {
            const map = keyMap[e.key.toLowerCase()];
            if (map) {
                const el = document.getElementById(map.id);
                if (el) el.classList.remove('active');
            }
        });
    </script>
</body>
</html>
