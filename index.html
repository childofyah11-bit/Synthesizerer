<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Idk situation</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b0b12;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { color: #00f2ff; margin-bottom: 5px; text-shadow: 0 0 15px rgba(0,242,255,0.4); }
        .subtitle { color: #707085; font-size: 14px; margin-bottom: 30px; }
        
        .panel {
            background-color: #141420;
            border: 2px solid #252538;
            border-radius: 16px;
            padding: 30px;
            max-width: 550px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        /* Power Toggle Button */
        .power-btn {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border: none;
            color: white;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            width: 80%;
        }
        .power-btn.active {
            background: linear-gradient(135deg, #ff0055, #9e0031);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
        }
        .power-btn:hover { transform: scale(1.02); }

        /* Sequencer Step Display Grid */
        .visual-track {
            display: flex;
            gap: 6px;
            justify-content: center;
            background-color: #08080f;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #1f1f33;
        }
        .step-block {
            flex: 1;
            height: 45px;
            background-color: #181826;
            border-radius: 6px;
            transition: all 0.1s ease;
            position: relative;
        }
        .step-block.active {
            background-color: #00f2ff;
            box-shadow: 0 0 15px #00f2ff;
        }
        .step-block.pulse-kick { border: 2px solid #ff0055; box-shadow: inset 0 0 10px rgba(255,0,85,0.5); }
        .step-block.pulse-snare { border: 2px solid #ffaa00; box-shadow: inset 0 0 10px rgba(255,170,0,0.5); }

        .dashboard {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            font-size: 12px;
            font-weight: bold;
            color: #a0a0c0;
            text-transform: uppercase;
            font-family: monospace;
        }
        .stat span { color: #00f2ff; display: block; font-size: 18px; margin-top: 4px; }
    </style>
</head>
<body>

    <h1>Neon Groove Arranger</h1>
    <div class="subtitle">Automatic Synthesis: Pro Chords, Melodic Arps & Drum Logic Arrays</div>

    <div class="panel">
        <!-- TRIGGER INTERFACE -->
        <button class="power-btn" id="jam-trigger">Start Groove <span>[Spacebar]</span></button>

        <!-- VISUAL LINE ILLUSION TRACK -->
        <div class="visual-track">
            <div class="step-block" id="st-0"></div>
            <div class="step-block" id="st-1"></div>
            <div class="step-block" id="st-2"></div>
            <div class="step-block" id="st-3"></div>
            <div class="step-block" id="st-4"></div>
            <div class="step-block" id="st-5"></div>
            <div class="step-block" id="st-6"></div>
            <div class="step-block" id="st-7"></div>
        </div>

        <!-- ENGINE STAT readout DISPLAY -->
        <div class="dashboard">
            <div class="stat">Tempo <span>120 BPM</span></div>
            <div class="stat">Key <span>A Minor</span></div>
            <div class="stat">Mode <span>Auto-Jam</span></div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let currentStep = 0;
        let intervalId = null;

        // Base structural frequencies mapping out a guitar/synth progression
        const chordProgression = [
            [220.00, 261.63, 329.63], // Am chord notes
            [220.00, 261.63, 329.63], 
            [174.61, 220.00, 261.63], // F Maj chord notes
            [174.61, 220.00, 261.63],
            [196.00, 246.94, 293.66], // G Maj chord notes
            [196.00, 246.94, 293.66],
            [164.81, 196.00, 246.94], // Em chord notes
            [164.81, 196.00, 246.94]
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- MODELLED SYNTH SYSTEMS ---
        function playKick() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.start(); osc.stop(audioCtx.currentTime + 0.12);
        }

        function playSnare() {
            const len = audioCtx.sampleRate * 0.1;
            const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            const src = audioCtx.createBufferSource(); src.buffer = buf;
            const filt = audioCtx.createBiquadFilter(); filt.type = 'highpass'; filt.frequency.value = 1800;
            const gain = audioCtx.createGain();
            src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            src.start(); src.stop(audioCtx.currentTime + 0.1);
        }

        // Simulates custom filtered physical properties resembling a plucked string instrument
        function playGuitarPluck(freq, delay) {
            setTimeout(() => {
                if(!isPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(2000, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            }, delay);
        }

        // --- ARRANGER CORE STEP LOGIC ---
        function runSequencerStep() {
            // Clean interface track highlights
            document.querySelectorAll('.step-block').forEach(b => b.className = 'step-block');
            
            const currentBlock = document.getElementById(`st-${currentStep}`);
            currentBlock.classList.add('active');

            // Drum Patterns Assignment Logic
            if (currentStep === 0 || currentStep === 4) {
                playKick();
                currentBlock.classList.add('pulse-kick');
            } else if (currentStep === 2 || currentStep === 6) {
                playSnare();
                currentBlock.classList.add('pulse-snare');
            }

            // Guitar Chords Strum logic algorithm array parsing
            const chord = chordProgression[currentStep];
            playGuitarPluck(chord[0], 0);   // Bass root note
            playGuitarPluck(chord[1], 30);  // Middle string pluck
            playGuitarPluck(chord[2], 60);  // High string pluck

            currentStep = (currentStep + 1) % 8;
        }

        function togglePlayback() {
            initAudio();
            const btn = document.getElementById('jam-trigger');
            
            if (isPlaying) {
                clearInterval(intervalId);
                isPlaying = false;
                btn.classList.remove('active');
                btn.innerHTML = 'Start Groove <span>[Spacebar]</span>';
                document.querySelectorAll('.step-block').forEach(b => b.className = 'step-block');
                currentStep = 0;
            } else {
                isPlaying = true;
                btn.classList.add('active');
                btn.innerHTML = 'Stop Groove <span>[Spacebar]</span>';
                // Drives the structural sequence running cleanly at 120BPM intervals
                intervalId = setInterval(runSequencerStep, 250);
            }
        }

        // --- LISTENERS ---
        document.getElementById('jam-trigger').addEventListener('click', togglePlayback);
        
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault(); // Disables browser page layout viewport shifts
                togglePlayback();
            }
        });
    </script>
</body>
</html>
