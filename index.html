<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keys & Drums Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 15px;
            user-select: none;
        }
        h1 { color: #00adb5; margin-bottom: 5px; }
        .hint { color: #888; font-size: 14px; margin-bottom: 20px; }
        
        .section-title {
            font-size: 18px;
            color: #eeeeee;
            margin: 20px 0 10px;
            text-align: left;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Keyboard Grid */
        .keyboard {
            display: flex;
            justify-content: center;
            gap: 6px;
            max-width: 650px;
            margin: 0 auto;
        }
        .key {
            flex: 1;
            height: 120px;
            background-color: #222831;
            border: 2px solid #393e46;
            border-radius: 6px;
            color: #eeeeee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 10px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .key .note-name { font-weight: bold; font-size: 16px; }
        .key .keyboard-hint { font-size: 12px; color: #00adb5; margin-top: 5px; font-family: monospace; }
        .key:active, .key.active {
            background-color: #00adb5;
            border-color: #00F2FF;
            color: #121214;
        }
        .key:active .keyboard-hint, .key.active .keyboard-hint { color: #121214; }

        /* Drums Layout */
        .drum-pad-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            max-width: 650px;
            margin: 0 auto 20px;
        }
        .drum-pad {
            flex: 1;
            height: 80px;
            background-color: #3f2b96;
            border: 2px solid #a8c0ff;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .drum-pad span { font-size: 11px; color: #a8c0ff; margin-top: 4px; font-family: monospace; }
        .drum-pad:active, .drum-pad.active {
            background-color: #a8c0ff;
            color: #3f2b96;
        }
        .drum-pad:active span, .drum-pad.active span { color: #3f2b96; }
    </style>
</head>
<body>

    <h1>Keys & Drums Studio</h1>
    <p class="hint">Click the pads or use your physical computer keyboard to play live loops!</p>

    <!-- DRUMS SECTION -->
    <div class="section-title">Drum Pads</div>
    <div class="drum-pad-container">
        <div class="drum-pad" id="drum-kick">KICK <span>[Space]</span></div>
        <div class="drum-pad" id="drum-snare">SNARE <span>[B]</span></div>
        <div class="drum-pad" id="drum-hihat">HI-HAT <span>[N]</span></div>
    </div>

    <!-- SYNTHESIZER SECTION -->
    <div class="section-title">Synthesizer Notes</div>
    <div class="keyboard">
        <div class="key" id="key-A" data-freq="261.63"><div class="note-name">C4</div><div class="keyboard-hint">A</div></div>
        <div class="key" id="key-S" data-freq="293.66"><div class="note-name">D4</div><div class="keyboard-hint">S</div></div>
        <div class="key" id="key-D" data-freq="329.63"><div class="note-name">E4</div><div class="keyboard-hint">D</div></div>
        <div class="key" id="key-F" data-freq="349.23"><div class="note-name">F4</div><div class="keyboard-hint">F</div></div>
        <div class="key" id="key-G" data-freq="392.00"><div class="note-name">G4</div><div class="keyboard-hint">G</div></div>
        <div class="key" id="key-H" data-freq="440.00"><div class="note-name">A4</div><div class="keyboard-hint">H</div></div>
        <div class="key" id="key-J" data-freq="493.88"><div class="note-name">B4</div><div class="keyboard-hint">J</div></div>
        <div class="key" id="key-K" data-freq="523.25"><div class="note-name">C5</div><div class="keyboard-hint">K</div></div>
        <div class="key" id="key-L" data-freq="587.33"><div class="note-name">D5</div><div class="keyboard-hint">L</div></div>
    </div>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- SYNTH NOTE PLAYER ---
        function playTone(frequency) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- CLEAN INDEPENDENT DRUM ENGINES ---
        function playKick() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playSnare() {
            initAudio();
            const bufferSize = audioCtx.sampleRate * 0.15;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 1200;

            const gainNode = audioCtx.createGain();

            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

            noise.start();
            noise.stop(audioCtx.currentTime + 0.15);
        }

        function playHiHat() {
            initAudio();
            const bufferSize = audioCtx.sampleRate * 0.04;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 8000;

            const gainNode = audioCtx.createGain();

            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

            noise.start();
            noise.stop(audioCtx.currentTime + 0.04);
        }

        // --- MAP KEYS TO ACTIONS ---
        const synthKeys = {
            'a': { id: 'key-A', freq: 261.63 },
            's': { id: 'key-S', freq: 293.66 },
            'd': { id: 'key-D', freq: 329.63 },
            'f': { id: 'key-F', freq: 349.23 },
            'g': { id: 'key-G', freq: 392.00 },
            'h': { id: 'key-H', freq: 440.00 },
            'j': { id: 'key-J', freq: 493.88 },
            'k': { id: 'key-K', freq: 523.25 },
            'l': { id: 'key-L', freq: 587.33 }
        };

        const drumKeys = {
            ' ': { id: 'drum-kick', action: playKick },
            'b': { id: 'drum-snare', action: playSnare },
            'n': { id: 'drum-hihat', action: playHiHat }
        };

        // --- EVENT LISTENERS ---
        // Mouse/Touch triggers
        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('pointerdown', () => {
                playTone(parseFloat(key.getAttribute('data-freq')));
            });
        });

        document.getElementById('drum-kick').addEventListener('pointerdown', playKick);
        document.getElementById('drum-snare').addEventListener('pointerdown', playSnare);
        document.getElementById('drum-hihat').addEventListener('pointerdown', playHiHat);

        // Physical Keyboard Event routing
        window.addEventListener('keydown', (e) => {
            const keyName = e.key.toLowerCase();
